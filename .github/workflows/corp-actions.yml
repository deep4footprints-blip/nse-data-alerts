name: corp-actions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capture corporate actions
        run: python scripts/capture_corp_actions.py
      - name: Commit
        run: |
          git config user.name "nse-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "data: corporate actions raw"
          git pull --rebase
          git push
