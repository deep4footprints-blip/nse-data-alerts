name: stage2-backtest
on:
  workflow_dispatch:
    inputs:
      models:
        description: "all or comma-separated model names"
        required: false
        default: "all"
  push:
    branches: [main]
    paths:
      - "scripts/stage2_backtest.py"
      - ".github/workflows/stage2-backtest.yml"
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python scripts/stage2_backtest.py --models "${{ github.event.inputs.models || 'all' }}"
      - name: Add summary to workflow
        if: always() && hashFiles('results/stage2_summary.md') != ''
        run: cat results/stage2_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/stage2_*') != ''
        with:
          name: stage2-backtest-${{ github.run_number }}
          path: results/stage2_*
          if-no-files-found: warn
      - name: Commit results
        if: success()
        run: |
          git config user.name "nse-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/stage2_*
          git diff --staged --quiet || git commit -m "results: Stage 2 backtest"
          git push
