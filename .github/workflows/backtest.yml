name: backtest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Label for this run (used in result file names)"
        default: "run"
      args:
        description: "Extra flags for scripts/backtest.py"
        default: "--sweep --null 40"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Backtest
        env:
          TAG: ${{ inputs.tag }}
          ARGS: ${{ inputs.args }}
        run: python scripts/backtest.py --tag "$TAG" $ARGS

      - name: Commit results
        run: |
          git config user.name "nse-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git diff --staged --quiet || git commit -m "results: backtest"
          git pull --rebase
          git push
